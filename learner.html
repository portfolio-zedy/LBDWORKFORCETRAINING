<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portal — Living By Design Nation</title>
  <link rel="icon" type="image/png" href="bck.png">
  <link rel="apple-touch-icon" href="bck.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<button class="mobile-menu-btn" id="mobileMenuBtn" onclick="toggleMobileSidebar()" aria-label="Toggle menu">☰</button>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeMobileSidebar()"></div>
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-icon"><img src="bck.png" alt="Living By Design Nation"></div>
        <div>
          <div class="brand-name">Living By Design Nation</div>
          <div class="brand-sub">WORKFORCE ACADEMY</div>
        </div>
      </div>
      <div class="user-info">
        <div class="user-name" id="sidebarName">Loading…</div>
        <div class="user-role">Leader</div>
      </div>
    </div>

    <div style="padding: 1.25rem 1.5rem 0.5rem;">
      <div style="font-size: 0.68rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.75rem;">My Paths</div>
      <div id="courseList">
        <div class="skeleton" style="height:36px;margin-bottom:6px;"></div>
        <div class="skeleton" style="height:36px;"></div>
      </div>
    </div>

    <div style="margin-top: auto; padding: 1.25rem 1.5rem; border-top: 1px solid var(--border-subtle);">
      <button class="btn-action btn-secondary" style="width: 100%; padding: 0.625rem; font-size: 0.82rem; justify-content: center;" onclick="logout()">Sign Out</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="topbar">
      <div>
        <div class="topbar-title" id="topbarTitle">My Portal</div>
        <div class="topbar-sub" id="topbarSub">Select a pathway to view your milestones</div>
      </div>
      <div id="progressSummary" style="display:none; align-items: center; gap: 1rem;">
        <div style="background: var(--bg-surface); border-radius: 20px; padding: 0.375rem 0.875rem; font-size: 0.8rem; color: var(--text-muted); display: flex; align-items: center; gap: 6px;">
          <span>Passed</span>
          <strong id="progressCount" style="color: var(--gold-lt);">0 / 0</strong>
        </div>
      </div>
    </div>

    <div class="content">
      <div style="max-width: 860px;" id="trackContainer">
        <div style="text-align: center; padding: 4rem 2rem;">
          <div style="font-size: 3rem; margin-bottom: 1rem; opacity: 0.4;">✨</div>
          <h3 style="font-family: 'DM Serif Display', serif; font-size: 1.4rem; color: var(--text-main); margin-bottom: 0.5rem;">Select a pathway</h3>
          <p style="color: var(--text-dim); font-size: 0.875rem;">Choose a path from the sidebar to view your milestones.</p>
        </div>
      </div>
    </div>

    <footer class="site-footer"><span class="dot">•</span>LIVING BY DESIGN NATION<span class="dot">•</span>WORKFORCE TRAINING CENTER<span class="dot">•</span><span id="footerYear"></span></footer>
  </main>

</div>

<script src="main.js"></script>
</body>
</html>
